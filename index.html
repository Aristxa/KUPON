<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kupon</title>
  <meta name="description" content="Skano kodin QR të kuponave tatimorë shqiptarë dhe shiko ku shkojnë paratë. Pa llogari, të dhënat mbeten në telefon.">
  <meta name="theme-color" content="#eceae4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kupon">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#home"><img src="icons/icon.svg" alt="" width="24" height="24"><span>Kupon</span></a>
    <button class="langbtn" type="button" data-act="lang" data-i18n="lang.switch" data-i18n-label="lang.label">EN</button>
  </header>

  <div class="banner" id="demo-banner" hidden>
    <span data-i18n="demo.banner"></span>
    <button type="button" class="btn small" data-act="exit-demo" data-i18n="demo.exit"></button>
  </div>
  <div class="banner warn" id="persist-warning" hidden><span data-i18n="store.nopersist"></span></div>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-scan" hidden></section>
    <section class="view" id="view-list" hidden></section>
    <section class="view" id="view-warranty" hidden></section>
    <section class="view" id="view-data" hidden></section>
  </main>

  <nav class="tabbar">
    <a href="#home" data-view="home" data-icon="data_pie"><span data-i18n="nav.home"></span></a>
    <a href="#list" data-view="list" data-icon="receipt"><span data-i18n="nav.list"></span></a>
    <a href="#scan" data-view="scan" data-icon="qr_code" class="scan-tab"><span data-i18n="nav.scan"></span></a>
    <a href="#warranty" data-view="warranty" data-icon="shield_checkmark"><span data-i18n="nav.warranty"></span></a>
    <a href="#data" data-view="data" data-icon="settings"><span data-i18n="nav.settings"></span></a>
  </nav>

  <dialog id="sheet"><div id="sheet-body" tabindex="-1"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="pad">Kupon needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
